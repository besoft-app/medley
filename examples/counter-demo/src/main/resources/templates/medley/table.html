<div class="table-demo">
  <table>
    <thead><tr><th>Nazwa</th><th>Ilość</th></tr></thead>
    <tbody><tr *for="row : rows" key="row.id"><td>{{ row.name }}</td><td>{{ row.qty }}</td></tr></tbody>
  </table>
  <button @click="addRow">dodaj wiersz</button>
  <button @click="removeFirst" *if="!empty">usuń pierwszy</button>
  <button @click="bumpFirst" *if="!empty">+1 ilość (pierwszy)</button>
</div>
