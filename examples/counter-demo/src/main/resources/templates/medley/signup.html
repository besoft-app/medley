<div class="signup-demo">
  <h1>Medley — walidacja formularza</h1>
  <p><input type="text" @input="setName($value)" placeholder="imię"><span *if="errors.name" class="error"> {{ errors.name }}</span></p>
  <p><input type="text" @input="setEmail($value)" placeholder="e-mail"><span *if="errors.email" class="error"> {{ errors.email }}</span></p>
  <button @click="submit">Zarejestruj</button>
  <p>zarejestrowani: {{ registered }}</p>
</div>
